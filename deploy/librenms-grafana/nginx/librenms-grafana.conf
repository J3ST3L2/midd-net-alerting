# Include inside the existing `server { ... }` block for keep.middlebury.edu, next to mist-dashboard.conf.
#
# The trailing slash on proxy_pass strips /netmap/ before Grafana sees the request, so Grafana
# itself stays at the root (same approach as the Mist dashboard). GRAFANA_ROOT_URL in .env must be
# https://keep.middlebury.edu/netmap/ so links and redirects come back through this prefix.

location = /netmap {
    return 301 /netmap/;
}

location /netmap/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Grafana Live (dashboard auto-refresh push) uses a websocket.
location /netmap/api/live/ {
    proxy_pass http://127.0.0.1:3001/api/live/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
}
