# Receives Orb sensor pushes (Orb Cloud > Configurations > datasets.push) and exposes them to Prometheus.
# Orb POSTs JSON to nginx (/orb-ingest/<secret>), which forwards to this listener's /ingest path. Nothing is
# written to disk and no raw payload is logged.
#
# Privacy: the pushes carry identifiable fields (sensor name and MAC, IPs, location). Only the tags listed in
# tag_keys become labels, and string_as_label = false drops every other string field, so sensor MACs, IP
# addresses, coordinates and the city never reach Prometheus. A test (test_orb_receiver.py) holds this line.
# Names of the metrics come from Telegraf: <dataset>_<field>, e.g. wifi_link_1s_rssi_avg.

[agent]
  interval = "30s"
  flush_interval = "10s"
  omit_hostname = true
  quiet = true

[[inputs.http_listener_v2]]
  service_address = ":7081"
  paths = ["/ingest"]
  methods = ["POST"]
  max_body_size = "20MB"
  read_timeout = "10s"
  write_timeout = "10s"

  data_format = "json"
  json_name_key = "dataset"
  json_time_key = "timestamp"
  json_time_format = "unix_ms"

  # The only fields that become labels. Absent keys are skipped for datasets that lack them.
  tag_keys = [
    "orb_id",
    "orb_name",
    "bssid",
    "network_name",
    "network_type",
    "web_url",
    "measure_endpoint_name",
    "channel_band",
    "channel_width",
    "phy_mode"
  ]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  string_as_label = false          # do not turn string fields (MAC, IPs, city, ...) into labels
  expiration_interval = "10m"      # a sensor that stops reporting disappears after 10 minutes
  collectors_exclude = ["gocollector", "process"]
  fieldexclude = ["utc_offset", "interval_ms", "latitude", "longitude", "location_source", "score_version"]
