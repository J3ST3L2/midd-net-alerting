# Include inside the existing `server { ... }` block for keep.middlebury.edu.
#
# The trailing slash on proxy_pass strips /mist-dashboard/ before Grafana sees the request,
# so Grafana itself stays at the root. Moving to a dedicated hostname later only needs
# GRAFANA_ROOT_URL changed and this block replaced by `location / { proxy_pass ...; }`.

# Shared dashboards are served on their own name (gravitron-shared.conf), never on this one, so a leaked
# link cannot be used to explore keep.middlebury.edu. The main Grafana, behind its login, stays below.
location /mist-dashboard/public-dashboards/ {
    return 404;
}

location /mist-dashboard/api/public/ {
    return 404;
}

location = /mist-dashboard {
    return 301 /mist-dashboard/;
}

location /mist-dashboard/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Grafana Live (dashboard auto-refresh push) uses a websocket.
location /mist-dashboard/api/live/ {
    proxy_pass http://127.0.0.1:3000/api/live/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
}
