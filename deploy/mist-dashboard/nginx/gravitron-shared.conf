# Shared (login-free) dashboards on their own HTTPS name, so people are never handed keep.middlebury.edu.
#
# Install as /etc/nginx/conf.d/gravitron-shared.conf (a whole `server`, not an include). It listens on 443 only,
# so the existing port-80 server for this name (middkips, netops) is untouched.
#
# It passes through exactly what a Grafana *public dashboard* needs, and nothing else: no login page, no other
# dashboards, no Explore, no API. Everything else is a 404. A dashboard is reachable only after someone has
# switched on Share > Share externally for it; the link carries an unguessable token.
#
# Certificate: issue gravitron.middlebury.edu the same way as keep's (acme-dns) and put the files at the paths below.

limit_req_zone $binary_remote_addr zone=shared_dash:10m rate=20r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gravitron.middlebury.edu;

    ssl_certificate     /etc/nginx/ssl/gravitron/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/gravitron/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_shared_dash:5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Not listed below: not served.
    location / {
        return 404;
    }

    # The shared page. Grafana lives under /mist-dashboard/ (GRAFANA_ROOT_URL); the trailing slash on
    # proxy_pass strips it, the same as the main block does.
    location /mist-dashboard/public-dashboards/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=shared_dash burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000/public-dashboards/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The panel data behind it. Panel queries are POSTs.
    location /mist-dashboard/api/public/dashboards/ {
        limit_except GET HEAD POST { deny all; }
        limit_req zone=shared_dash burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000/api/public/dashboards/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana's own scripts, styles, fonts and images.
    location /mist-dashboard/public/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3000/public/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
