# Grafana for the Mist and Aruba dashboards, served at https://gravitron.middlebury.edu/mist-dashboard/
# (keep.middlebury.edu is for alerting only and serves none of this).
#
# Install as /etc/nginx/conf.d/gravitron-dashboards.conf (a whole `server`, not an include). It listens on 443
# only, so the existing port-80 server for this name (middkips, netops) is untouched; always use the https link.
#
# Two kinds of visitor reach Grafana here:
#   - staff, who sign in at /mist-dashboard/ (Grafana's own login; anonymous access is off);
#   - anyone holding a *public dashboard* link (Share > Share externally), who sees only that dashboard.
# The public-dashboard paths are rate limited per visitor. Anything outside /mist-dashboard/ is a 404.
#
# Certificate: gravitron.middlebury.edu, issued by acme.sh (acme-dns). Install it with
#   sudo /opt/acme.sh/acme.sh --home /opt/acme.sh --config-home /etc/letsencrypt --install-cert --ecc \
#     -d gravitron.middlebury.edu --key-file /etc/nginx/ssl/gravitron/privkey.pem \
#     --fullchain-file /etc/nginx/ssl/gravitron/fullchain.pem --reloadcmd "systemctl reload nginx"
# which also makes every renewal re-copy it and reload nginx.

limit_req_zone $binary_remote_addr zone=shared_dash:10m rate=20r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gravitron.middlebury.edu;

    ssl_certificate     /etc/nginx/ssl/gravitron/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/gravitron/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_shared_dash:5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Not listed below: not served.
    location / {
        return 404;
    }

    location = /mist-dashboard {
        return 301 /mist-dashboard/;
    }

    # Grafana. The trailing slash on proxy_pass strips /mist-dashboard/ before Grafana sees the request, so
    # Grafana itself stays at the root (GRAFANA_ROOT_URL carries the prefix for the links it builds).
    location /mist-dashboard/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public dashboards: the shared page and the panel data behind it (panel queries are POSTs). Same proxy,
    # plus a per-visitor rate limit, because anyone with a link can reach these without signing in.
    location /mist-dashboard/public-dashboards/ {
        limit_req zone=shared_dash burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000/public-dashboards/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mist-dashboard/api/public/dashboards/ {
        limit_req zone=shared_dash burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000/api/public/dashboards/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live (dashboard auto-refresh push) uses a websocket.
    location /mist-dashboard/api/live/ {
        proxy_pass http://127.0.0.1:3000/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }
}
