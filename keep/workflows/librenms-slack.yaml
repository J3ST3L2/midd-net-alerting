workflow:
  id: middlebury-librenms-slack
  name: Middlebury LibreNMS Slack
  description: Stateful LibreNMS lifecycle delivery through NMS-Alert-Bot to both network alert channels.
  disabled: false

  triggers:
    - type: alert
      filters:
        - key: source
          value: librenms

  actions:
    - name: slack-resolved-update-net
      if: "'{{ alert.slack_timestamp_net }}' and '{{ alert.status }}' == 'resolved'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          slack_timestamp: "{{ alert.slack_timestamp_net }}"
          channel: C0C4MSELS4D
          attachments:
            - fallback: "{{ alert.device }} RECOVERED • {{ alert.rule }}"
              color: "#39ff14"
              author_name: "{{ alert.device }} RECOVERED"
              author_link: "{{ alert.url }}"
              author_icon: "{{ alert.vendor_icon }}"
              fields:
                - title: Issue
                  value: "{{ alert.rule }}"
                  short: false
                - title: IP
                  value: "{{ alert.ip }}"
                  short: true
                - title: Duration
                  value: "{{ alert.duration }}"
                  short: true
                - title: Started
                  value: "{{ alert.fired }}"
                  short: true
                - title: Recovered
                  value: "{{ alert.resolved }}"
                  short: true
              footer: "LibreNMS • Open in LibreNMS: {{ alert.url }}"

    - name: slack-resolved-update-nms
      if: "'{{ alert.slack_timestamp_nms }}' and '{{ alert.status }}' == 'resolved'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          slack_timestamp: "{{ alert.slack_timestamp_nms }}"
          channel: C0AHUT40W0Z
          attachments:
            - fallback: "{{ alert.device }} RECOVERED • {{ alert.rule }}"
              color: "#39ff14"
              author_name: "{{ alert.device }} RECOVERED"
              author_link: "{{ alert.url }}"
              author_icon: "{{ alert.vendor_icon }}"
              fields:
                - title: Issue
                  value: "{{ alert.rule }}"
                  short: false
                - title: IP
                  value: "{{ alert.ip }}"
                  short: true
                - title: Duration
                  value: "{{ alert.duration }}"
                  short: true
                - title: Started
                  value: "{{ alert.fired }}"
                  short: true
                - title: Recovered
                  value: "{{ alert.resolved }}"
                  short: true
              footer: "LibreNMS • Open in LibreNMS: {{ alert.url }}"

    - name: slack-firing-net
      if: "not '{{ alert.slack_timestamp_net }}' or '{{ alert.status }}' == 'firing'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          channel: C0C4MSELS4D
          enrich_alert:
            - key: slack_timestamp_net
              value: results.slack_timestamp
          attachments:
            - fallback: "{{ alert.device }} DOWN • {{ alert.rule }}"
              color: "#ff3131"
              author_name: "{{ alert.device }} DOWN"
              author_link: "{{ alert.url }}"
              author_icon: "{{ alert.vendor_icon }}"
              fields:
                - title: Issue
                  value: "{{ alert.rule }}"
                  short: false
                - title: IP
                  value: "{{ alert.ip }}"
                  short: true
                - title: Started
                  value: "{{ alert.fired }}"
                  short: true
              footer: "LibreNMS • Open in LibreNMS: {{ alert.url }}"

    - name: slack-firing-nms
      if: "not '{{ alert.slack_timestamp_nms }}' or '{{ alert.status }}' == 'firing'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          channel: C0AHUT40W0Z
          enrich_alert:
            - key: slack_timestamp_nms
              value: results.slack_timestamp
          attachments:
            - fallback: "{{ alert.device }} DOWN • {{ alert.rule }}"
              color: "#ff3131"
              author_name: "{{ alert.device }} DOWN"
              author_link: "{{ alert.url }}"
              author_icon: "{{ alert.vendor_icon }}"
              fields:
                - title: Issue
                  value: "{{ alert.rule }}"
                  short: false
                - title: IP
                  value: "{{ alert.ip }}"
                  short: true
                - title: Started
                  value: "{{ alert.fired }}"
                  short: true
              footer: "LibreNMS • Open in LibreNMS: {{ alert.url }}"
