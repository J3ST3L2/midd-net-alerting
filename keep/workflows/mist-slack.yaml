workflow:
  id: middlebury-mist-slack
  name: Middlebury Mist Slack
  description: Stateful Mist lifecycle delivery through NMS-Alert-Bot to both network alert channels.
  disabled: false

  triggers:
    - type: alert
      filters:
        - key: source
          value: mist

  actions:
    - name: slack-resolved-update-net
      if: "'{{ alert.slack_timestamp_net_mist_v1 }}' and '{{ alert.status }}' == 'resolved'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          slack_timestamp: "{{ alert.slack_timestamp_net_mist_v1 }}"
          channel: C0C4MSELS4D
          enrich_alert:
            - key: slack_timestamp_net_mist_v1
              value: ""
          attachments:
            - fallback: "{{ alert.labels.mist_device }} RECOVERED • {{ alert.labels.mist_event_type }}"
              color: "#39ff14"
              author_name: "{{ alert.labels.mist_device }} RECOVERED"
              fields:
                - title: Event
                  value: "{{ alert.labels.mist_event_type }}"
                  short: false
                - title: Site
                  value: "{{ alert.labels.mist_site_name }}"
                  short: true
                - title: MAC
                  value: "{{ alert.labels.mist_mac }}"
                  short: true
                - title: IP
                  value: "{{ alert.labels.mist_ip }}"
                  short: true
                - title: Model
                  value: "{{ alert.labels.mist_model }}"
                  short: true
                - title: Firmware
                  value: "{{ alert.labels.mist_firmware }}"
                  short: true
                - title: Last seen by Mist
                  value: "{{ alert.labels.mist_last_seen }}"
                  short: true
                - title: State
                  value: "{{ alert.labels.mist_state }}"
                  short: true
                - title: Recovered
                  value: "{{ alert.lastReceived }}"
                  short: true
              footer: "Mist • Keep"

    - name: slack-firing-net
      if: "not '{{ alert.slack_timestamp_net_mist_v1 }}' and '{{ alert.status }}' == 'firing'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          channel: C0C4MSELS4D
          enrich_alert:
            - key: slack_timestamp_net_mist_v1
              value: results.slack_timestamp
          attachments:
            - fallback: "{{ alert.labels.mist_device }} DOWN • {{ alert.labels.mist_event_type }}"
              color: "#ff3131"
              author_name: "{{ alert.labels.mist_device }} DOWN"
              fields:
                - title: Event
                  value: "{{ alert.labels.mist_event_type }}"
                  short: false
                - title: Site
                  value: "{{ alert.labels.mist_site_name }}"
                  short: true
                - title: MAC
                  value: "{{ alert.labels.mist_mac }}"
                  short: true
                - title: IP
                  value: "{{ alert.labels.mist_ip }}"
                  short: true
                - title: Model
                  value: "{{ alert.labels.mist_model }}"
                  short: true
                - title: Firmware
                  value: "{{ alert.labels.mist_firmware }}"
                  short: true
                - title: Last seen by Mist
                  value: "{{ alert.labels.mist_last_seen }}"
                  short: true
                - title: State
                  value: "{{ alert.labels.mist_state }}"
                  short: true
                - title: Started
                  value: "{{ alert.lastReceived }}"
                  short: true
              footer: "Mist • Keep"

