workflow:
  id: middlebury-efficientip-slack
  name: Middlebury EfficientIP Slack
  description: Stateful EfficientIP SOLIDserver lifecycle delivery through NMS-Alert-Bot to efficientip-alerts.
  disabled: false

  triggers:
    - type: alert
      filters:
        - key: source
          value: efficientip

  actions:
    - name: slack-resolved-update-efficientip
      if: "'{{ alert.slack_timestamp_efficientip_v1 }}' and '{{ alert.status }}' == 'resolved'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          slack_timestamp: "{{ alert.slack_timestamp_efficientip_v1 }}"
          channel: C0BG31RLY1H
          enrich_alert:
            - key: slack_timestamp_efficientip_v1
              value: ""
          attachments:
            - fallback: "{{ alert.fired_host }} - {{ alert.event }} • Resolved"
              color: "#39ff14"
              author_name: "{{ alert.fired_host }} - {{ alert.event }}"
              fields:
                - title: Status
                  value: "Resolved"
                  short: true
                - title: Severity
                  value: "{{ alert.severity }}"
                  short: true
                - title: Details
                  value: "{{ alert.message }}"
                  short: false
                - title: Was
                  value: "{{ alert.fired_message }}"
                  short: false
                - title: Object
                  value: "{{ alert.fired_object }}"
                  short: true
                - title: Relay / IP
                  value: "{{ alert.fired_ip }}"
                  short: true
                - title: Recovered
                  value: "{{ alert.lastReceived }}"
                  short: true
              footer: "EfficientIP SOLIDserver • Keep"

    - name: slack-firing-efficientip
      if: "not '{{ alert.slack_timestamp_efficientip_v1 }}' and '{{ alert.status }}' == 'firing'"
      provider:
        type: slack
        config: "{{ providers.middlebury-nms-alert-bot }}"
        with:
          channel: C0BG31RLY1H
          enrich_alert:
            - key: slack_timestamp_efficientip_v1
              value: results.slack_timestamp
            - key: fired_host
              value: "{{ alert.hostname }}"
            - key: fired_object
              value: "{{ alert.object }}"
            - key: fired_ip
              value: "{{ alert.ip }}"
            - key: fired_message
              value: "{{ alert.message }}"
          attachments:
            - fallback: "{{ alert.hostname }} - {{ alert.event }} • Ongoing"
              color: "#ff3131"
              author_name: "{{ alert.hostname }} - {{ alert.event }}"
              fields:
                - title: Status
                  value: "Ongoing"
                  short: true
                - title: Severity
                  value: "{{ alert.severity }}"
                  short: true
                - title: Details
                  value: "{{ alert.message }}"
                  short: false
                - title: Object
                  value: "{{ alert.object }}"
                  short: true
                - title: Relay / IP
                  value: "{{ alert.ip }}"
                  short: true
                - title: Started
                  value: "{{ alert.lastReceived }}"
                  short: true
              footer: "EfficientIP SOLIDserver • Keep"
